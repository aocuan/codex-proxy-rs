name: Fork image

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'release/version.yaml'
      - '.github/workflows/fork-image.yml'
      - '.github/actions/cargo-cache/**'
      - '.github/actions/verify-container/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image-evaluation
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/aocuan/codex-proxy-rs

jobs:
  build:
    if: github.repository == 'aocuan/codex-proxy-rs' && github.ref == 'refs/heads/main'
    name: Build and verify (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Define fork build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(ruby -ryaml -e 'puts YAML.load_file("release/version.yaml").fetch("version").delete_prefix("v")')"
          {
            echo "version=${version}+aocuan.${GITHUB_SHA:0:12}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore Cargo snapshot
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fork-container-cargo
          key: fork-container-cargo-v1-${{ matrix.arch }}-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml', 'backend/**/Cargo.toml', 'deploy/Dockerfile', '.github/actions/cargo-cache/Dockerfile') }}
          restore-keys: |
            fork-container-cargo-v1-${{ matrix.arch }}-

      - name: Restore Cargo mounts to BuildKit
        id: cargo-restore
        uses: ./.github/actions/cargo-cache
        with:
          operation: restore
          builder: ${{ steps.buildx.outputs.name }}
          path: ${{ runner.temp }}/fork-container-cargo
          architecture: ${{ matrix.arch }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先上传内容寻址产物，两个平台均验收通过后才发布部署标签
      - name: Build image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CPR_VERSION=${{ steps.metadata.outputs.version }}
            CPR_GIT_SHA=${{ github.sha }}
            CPR_BUILD_TIME=${{ steps.metadata.outputs.build_time }}
            CPR_BUILD_TYPE=source
          no-cache-filters: |
            runtime-base
            runtime
          cache-from: type=gha,scope=fork-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fork-runtime-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=Codex Proxy RS (aocuan)
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/aocuan/codex-proxy-rs

      - name: Verify exact image digest
        uses: ./.github/actions/verify-container
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          platform: linux/${{ matrix.arch }}
          artifact-name: fork-container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}

      - name: Record verified digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/fork-image-digests"
          touch "$RUNNER_TEMP/fork-image-digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload verified digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/fork-image-digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Export Cargo snapshot
        id: cargo-snapshot
        if: steps.cargo-cache.outputs.cache-hit != 'true' || steps.cargo-restore.outputs.usable != 'true'
        uses: ./.github/actions/cargo-cache
        with:
          operation: snapshot
          builder: ${{ steps.buildx.outputs.name }}
          path: ${{ runner.temp }}/fork-container-cargo
          architecture: ${{ matrix.arch }}

      - name: Save Cargo snapshot
        if: steps.cargo-snapshot.outputs.usable == 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fork-container-cargo
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/fork-image-digests
          pattern: fork-image-digest-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        shell: bash
        working-directory: ${{ runner.temp }}/fork-image-digests
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE_NAME@sha256:$digest")
          done
          test "${#sources[@]}" = 2
          docker buildx imagetools create --tag "$IMAGE_NAME:sha-$GITHUB_SHA" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:sha-$GITHUB_SHA" --raw > "$RUNNER_TEMP/fork-image-index.json"
          ruby -rjson -e '
            manifest = JSON.parse(File.read(ARGV.fetch(0)))
            platforms = manifest.fetch("manifests").filter_map do |item|
              platform = item.fetch("platform")
              "#{platform.fetch("os")}/#{platform.fetch("architecture")}" if platform["os"] == "linux"
            end
            raise "Expected amd64 and arm64 images" unless platforms.sort == %w[linux/amd64 linux/arm64]
          ' "$RUNNER_TEMP/fork-image-index.json"
          docker buildx imagetools create --tag "$IMAGE_NAME:evaluation" "$IMAGE_NAME:sha-$GITHUB_SHA"
          {
            echo '### 自研测评镜像'
            echo "- 提交：$GITHUB_SHA"
            echo "- 提交标签：\`$IMAGE_NAME:sha-$GITHUB_SHA\`"
            echo "- 更新标签：\`$IMAGE_NAME:evaluation\`"
            echo '- 平台：linux/amd64、linux/arm64'
            echo '- 两个平台已通过容器扫描、启动、持久化和关闭检查'
          } >> "$GITHUB_STEP_SUMMARY"
