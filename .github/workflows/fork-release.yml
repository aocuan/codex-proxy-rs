name: Fork release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release-evaluation
  queue: max
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/aocuan/codex-proxy-rs

jobs:
  metadata:
    if: github.repository == 'aocuan/codex-proxy-rs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      build_time: ${{ steps.release.outputs.build_time }}
      docker_matrix: ${{ steps.release.outputs.docker_matrix }}
      rust: ${{ steps.toolchains.outputs.rust }}
      rust_image: ${{ steps.toolchains.outputs.rust_image }}
    steps:
      - name: Verify selected commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::source_sha must match the main commit selected for this run"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify fork release contracts
        run: ruby .github/scripts/tests/fork-release_test.rb

      - name: Read build toolchains
        id: toolchains
        run: ruby .github/scripts/toolchains.rb >> "$GITHUB_OUTPUT"

      - name: Define and seal fork release metadata
        id: release
        run: ruby .github/scripts/fork-release.rb metadata >> "$GITHUB_OUTPUT"

      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-metadata
          path: |
            dist/fork-release.json
            dist/plugin-release-assets/plugin-release-manifest.json
          if-no-files-found: error
          retention-days: 7

  quality:
    needs: metadata
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ github.sha }}
      run_frontend: false

  security:
    needs: metadata
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ github.sha }}

  frontend:
    needs: metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Validate and build frontend
        uses: ./.github/actions/build-frontend
        with:
          upload-artifact: 'true'

  binary:
    needs: metadata
    name: Build binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.docker_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Build cached release binary
        uses: ./.github/actions/build-binary
        with:
          rust: ${{ needs.metadata.outputs.rust }}
          target: ${{ matrix.target }}
          platform: ${{ matrix.os }}-${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          rust-image: ${{ needs.metadata.outputs.rust_image }}
        env:
          CPR_VERSION: ${{ needs.metadata.outputs.version }}
          CPR_GIT_SHA: ${{ github.sha }}
          CPR_BUILD_TIME: ${{ needs.metadata.outputs.build_time }}
          CPR_BUILD_TYPE: release

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/binaries/${{ matrix.os }}-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [metadata, frontend, binary]
    name: Build and verify (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.docker_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-release-metadata
          path: dist

      - name: Download frontend artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: dist/docker/web/dist

      - name: Download binary artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/docker-artifacts/${{ matrix.artifact }}

      - name: Prepare Docker prebuilt assets
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_BINARY: ${{ matrix.binary }}
        run: ruby .github/scripts/package-release.rb image

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先上传内容寻址产物，两个平台均验收通过后才发布部署标签
      - name: Build image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime-prebuilt
          platforms: ${{ matrix.dockerPlatform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CPR_UPDATE_REPOSITORY=${{ github.repository }}
          no-cache-filters: |
            runtime-base
            runtime-prebuilt
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=Codex Proxy RS (aocuan)
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/aocuan/codex-proxy-rs

      - name: Verify exact image digest
        uses: ./.github/actions/verify-container
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          platform: ${{ matrix.dockerPlatform }}
          artifact-name: fork-container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}

      - name: Record verified digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/fork-image-digests"
          touch "$RUNNER_TEMP/fork-image-digests/${IMAGE_DIGEST#sha256:}"

      - name: Package the verified image for online updates
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          container="$(docker create "$IMAGE_NAME@$IMAGE_DIGEST")"
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p "dist/binaries/codex-proxy-rs-linux-$ARCH" dist/frontend
          docker cp "$container:/app/bin/codex-proxy-rs" "dist/binaries/codex-proxy-rs-linux-$ARCH/codex-proxy-rs"
          docker cp "$container:/app/web/dist/." dist/frontend/
          docker cp "$container:/app/bin/plugins/official/plugin-release-manifest.json" dist/image-manifest.json
          cmp dist/image-manifest.json dist/plugin-release-assets/plugin-release-manifest.json
          ruby .github/scripts/fork-release.rb package "$ARCH"

      - name: Upload online update archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-platform-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload verified digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/fork-image-digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [metadata, quality, security, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-release-metadata
          path: dist

      - name: Download online update archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fork-release-platform-*
          path: dist/release-platforms

      - name: Download verified digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/fork-image-digests
          pattern: fork-image-digest-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble verified multi-platform image
        id: manifest
        shell: bash
        working-directory: ${{ runner.temp }}/fork-image-digests
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE_NAME@sha256:$digest")
          done
          test "${#sources[@]}" = 2
          docker buildx imagetools create --tag "$IMAGE_NAME:sha-$GITHUB_SHA" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:sha-$GITHUB_SHA" --raw > "$RUNNER_TEMP/fork-image-index.json"
          ruby -rjson -e '
            manifest = JSON.parse(File.read(ARGV.fetch(0)))
            platforms = manifest.fetch("manifests").filter_map do |item|
              platform = item.fetch("platform")
              "#{platform.fetch("os")}/#{platform.fetch("architecture")}" if platform["os"] == "linux"
            end
            raise "Expected amd64 and arm64 images" unless platforms.sort == %w[linux/amd64 linux/arm64]
          ' "$RUNNER_TEMP/fork-image-index.json"
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          ruby .github/scripts/fork-release.rb collect "$DIGEST"
          ruby .github/scripts/fork-release.rb prepare >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Release assets
        id: release
        if: steps.prepare.outputs.release_id == ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Codex Proxy RS 自研 ${{ needs.metadata.outputs.version }}
          prerelease: true
          draft: true
          make_latest: 'false'
          body_path: dist/fork-release-notes.md
          fail_on_unmatched_files: true
          files: dist/release/*

      - name: Publish release and advance evaluation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id || steps.release.outputs.id }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          ruby .github/scripts/fork-release.rb publish "$DIGEST"
          {
            echo '### 自研测评发行'
            echo "- 版本：$VERSION"
            echo "- 提交：$GITHUB_SHA"
            echo "- 更新标签：\`$IMAGE_NAME:evaluation\`"
            echo "- Release：https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            echo '- 平台：linux/amd64、linux/arm64'
            echo '- 质量检查、依赖审计、双架构容器验收与在线更新包校验通过'
          } >> "$GITHUB_STEP_SUMMARY"
